# Purpose: configure the Python frontend port and appearance.
# Work: serve the browser interface on port 5173 with usage telemetry disabled.

[server]
port = 5173
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#172033"
font = "sans serif"
