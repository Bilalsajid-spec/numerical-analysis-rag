# Purpose: describe the Python package and its build settings.
# Work: define package metadata and the src/rag_nm layout for editable installation.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numerical-analysis-rag"
version = "1.0.0"
description = "Fully local, PDF-grounded numerical analysis study assistant"
readme = "README.md"
requires-python = ">=3.10,<3.15"

[tool.setuptools.packages.find]
where = ["src"]
