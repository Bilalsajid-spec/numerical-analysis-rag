# Purpose: run automated checks on GitHub pushes and pull requests.
# Work: run the test suite on Windows/Python 3.14 without downloading inference models.
name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies and project package
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-build-isolation -e .

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run automated tests
        run: python -B -m unittest discover -s tests -v
